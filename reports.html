<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Report Templates</title>
<style>
  :root{
    --bg:#0f1720; --panel:#1a2430; --panel2:#212d3b; --border:#2e3d4d;
    --text:#e8edf2; --muted:#8fa1b3; --accent:#3d8bfd; --ok:#2fa36b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:20px;
  }
  main{max-width:420px; width:100%; margin:0 auto;}
  a.back{color:var(--muted); font-size:13px; text-decoration:none; display:inline-block; margin-bottom:14px;}
  a.back:active{color:var(--text);}
  h1{font-size:20px; margin:0 0 6px;}
  p.sub{color:var(--muted); font-size:14px; margin:0 0 22px;}
  label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px; font-weight:600;}
  select,input,textarea{
    width:100%; background:var(--panel); color:var(--text); font-size:16px;
    border:1px solid var(--border); border-radius:10px; padding:12px;
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  select:focus,input:focus,textarea:focus{outline:none; border-color:var(--accent);}
  textarea{min-height:110px; resize:vertical; line-height:1.45;}
  .picker{margin-bottom:22px;}
  .field{margin-bottom:14px;}
  h2.section{
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); margin:26px 0 10px;
  }
  pre.preview{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:14px; font-size:12.5px; line-height:1.5; color:var(--text);
    white-space:pre-wrap; word-break:break-word; margin:0 0 14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  .row{display:flex; gap:10px;}
  button{
    flex:1; font-size:15px; font-weight:600; font-family:inherit; padding:14px;
    border-radius:10px; border:1px solid var(--border); cursor:pointer;
  }
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  button.primary.done{background:var(--ok); border-color:var(--ok);}
  button.ghost{background:var(--panel); color:var(--muted);}
  button:active{opacity:.85;}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">&larr; Back</a>
  <h1>Report Templates</h1>
  <p class="sub">Pick a report, fill it in, copy it out.</p>

  <div class="picker">
    <label for="type">Report type</label>
    <select id="type"></select>
  </div>

  <div id="fields"></div>

  <h2 class="section">Preview</h2>
  <pre class="preview" id="preview"></pre>
  <div class="row">
    <button class="primary" id="copy" type="button">Copy Report</button>
    <button class="ghost" id="clear" type="button">Clear</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  // Each report is fully independent - no fields are carried between them.
  // "big" marks a field whose value is written on the lines below its label.
  var REPORTS = {
    salute: {
      name: "SALUTE Report",
      title: "SALUTE REPORT",
      fields: [
        { label: "Line 1 (Type)", preset: "Salute Report" },
        { label: "Line 2 (Unit)" },
        { label: "Line 3 (Size)" },
        { label: "Line 4 (Activity)", big: true },
        { label: "Line 5 (Location, LAT-LONG)" },
        { label: "Line 6 (Uniform)" },
        { label: "Line 7 (Time Started DTG)" },
        { label: "Line 8 (Time Ended DTG)" },
        { label: "Line 9 (Equipment)", big: true },
        { label: "Line 10 (Location of Crossing Point)" },
        { label: "Line 11 (Instructions given to II by Coyotes)", big: true },
        { label: "Line 12 (Location and Time C-Wire was cut)" },
        { label: "Line 13 (Narrative)", big: true }
      ]
    },
    splaat: {
      name: "SPLAAT Report",
      title: "SPLAAT REPORT",
      fields: [
        { label: "Size" },
        { label: "Payload" },
        { label: "Location" },
        { label: "Altitude" },
        { label: "Activity", big: true },
        { label: "Time" }
      ]
    },
    spot: {
      name: "SPOT Report",
      title: "SPOT REPORT",
      fields: [
        { label: "Line 1 (Type)" },
        { label: "Line 2 (Task Force)" },
        { label: "Line 3 (DTG of Report)" },
        { label: "Line 4 (All Involved)", big: true },
        { label: "Line 5 (SM Phone)" },
        { label: "Line 6 (SM Mil E-Mail)" },
        { label: "Line 7 (Short Description)" },
        { label: "Line 8 (Location)" },
        { label: "Line 9 (DTG of Event)" },
        { label: "Line 10 (Narrative)", big: true },
        { label: "Line 11 (Unit Assigned)" },
        { label: "Line 12 (Organic Unit)" },
        { label: "Line 13 (SM Hospitalized)" },
        { label: "Line 14 (Hospital Phone #)" },
        { label: "Line 15 (Hospital Address)", big: true }
      ]
    },
    engineer: {
      name: "Engineer Report",
      title: "ENGINEER REPORT",
      fields: [
        { label: "LINE 1 (Report Type)" },
        { label: "LINE 2 (Task Force / Unit)" },
        { label: "LINE 3 (DTG of Report)" },
        { label: "LINE 4 (Project ID / Name)" },
        { label: "LINE 5 (Project Status %)" },
        { label: "LINE 6 (Location / Grid / Latitude, Longitude)" },
        { label: "LINE 7 (Obstacle Type / Target)" },
        { label: "LINE 8 (BOM Required)", big: true },
        { label: "LINE 9 (BOM Expended / On-Hand)", big: true },
        { label: "LINE 10 (Estimated Time to Complete)" },
        { label: "LINE 11 (Point of Contact)" },
        { label: "LINE 12 (POC Phone #)" },
        { label: "LINE 13 (POC Mil/E-Mail)" },
        { label: "LINE 14 (Security/Cover Force Unit)" },
        { label: "LINE 15 (Narrative/Remarks)", big: true }
      ]
    }
  };

  var ORDER = ["salute", "splaat", "spot", "engineer"];

  var typeEl = document.getElementById("type");
  var fieldsEl = document.getElementById("fields");
  var previewEl = document.getElementById("preview");
  var copyEl = document.getElementById("copy");
  var clearEl = document.getElementById("clear");

  // Values live here per report, so switching the dropdown and coming back
  // does not throw away what was already typed. Nothing is written to disk.
  var values = {};
  ORDER.forEach(function(key){
    values[key] = REPORTS[key].fields.map(function(f){ return f.preset || ""; });
  });

  var current = ORDER[0];
  var copyTimer = null;

  ORDER.forEach(function(key){
    var opt = document.createElement("option");
    opt.value = key;
    opt.textContent = REPORTS[key].name;
    typeEl.appendChild(opt);
  });

  function build(){
    var report = REPORTS[current];
    fieldsEl.textContent = "";

    report.fields.forEach(function(field, i){
      var wrap = document.createElement("div");
      wrap.className = "field";

      var id = current + "-" + i;
      var lab = document.createElement("label");
      lab.setAttribute("for", id);
      lab.textContent = field.label;

      var input = document.createElement(field.big ? "textarea" : "input");
      input.id = id;
      if (!field.big) { input.type = "text"; }
      input.value = values[current][i];
      input.addEventListener("input", function(){
        values[current][i] = input.value;
        render();
      });

      wrap.appendChild(lab);
      wrap.appendChild(input);
      fieldsEl.appendChild(wrap);
    });

    render();
  }

  // Every line is emitted, filled or not, so the line numbering always matches
  // the template the receiving station is reading against.
  function compose(){
    var report = REPORTS[current];
    var out = [report.title];

    report.fields.forEach(function(field, i){
      var value = values[current][i].trim();
      if (field.big) {
        out.push(field.label + ":");
        if (value) { out.push(value); }
      } else {
        out.push(field.label + ": " + value);
      }
    });

    return out.join("\n");
  }

  function render(){
    previewEl.textContent = compose();
  }

  function flash(text){
    copyEl.textContent = text;
    copyEl.classList.add("done");
    if (copyTimer) { clearTimeout(copyTimer); }
    copyTimer = setTimeout(function(){
      copyEl.textContent = "Copy Report";
      copyEl.classList.remove("done");
    }, 1600);
  }

  // Older mobile browsers, and any page not on https, have no async clipboard.
  function legacyCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  typeEl.addEventListener("change", function(){
    current = typeEl.value;
    build();
    window.scrollTo(0, 0);
  });

  copyEl.addEventListener("click", function(){
    var text = compose();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        flash("Copied");
      }, function(){
        flash(legacyCopy(text) ? "Copied" : "Press and hold to copy");
      });
    } else {
      flash(legacyCopy(text) ? "Copied" : "Press and hold to copy");
    }
  });

  clearEl.addEventListener("click", function(){
    if (!window.confirm("Clear every field in this report?")) { return; }
    values[current] = REPORTS[current].fields.map(function(f){ return f.preset || ""; });
    build();
  });

  build();
})();
</script>
</body>
</html>
